<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" class="login-form">
        <h2 class="mb-4">Login</h2>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter username" name="username" [(ngModel)]="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Password" name="password" [(ngModel)]="password">
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Login</button>
          <button type="button" class="btn btn-secondary" (click)="onSignUp()">Sign up</button>
        </div>
      </form>
    </div>
  </div>
</div>
