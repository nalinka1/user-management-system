<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <form #signupForm="ngForm" (ngSubmit)="onSubmit(signupForm)" class="login-form">
        <h2 class="mb-4">Signup</h2>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="Enter email" name="email" [(ngModel)]="email" required>
        </div>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter username" name="username" [(ngModel)]="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Password" name="password" [(ngModel)]="password" required>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" name="confirmPassword" [(ngModel)]="confirmPassword" required>
        </div>
        <!--<div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>-->
        <button type="submit" class="btn btn-primary btn-block">Signup</button>
      </form>
    </div>
  </div>
</div>
